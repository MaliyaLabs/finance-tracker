<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MaliyaLabs | Finance Tracker</title>
</head>
<body>
  <h1>Finance Tracker</h1>
  
  <div>
    <label>Monthly Income:</label>
    <input type="number" id="income" placeholder="e.g. 5000">
  </div>
  
  <div>
    <label>Monthly Expenses:</label>
    <input type="number" id="expenses" placeholder="e.g. 3000">
  </div>

  <button onclick="calculateSavings()">Calculate Net Savings</button>
  
  <h2 id="result">Net Savings: $0</h2>
</body>
</html>
